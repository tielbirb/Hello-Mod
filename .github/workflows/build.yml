gradlelew: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
      - run: chmod +x gradlew
      - run: ./gradlew setupCiWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TielCraftsDumbHello-jar
          path: build/libs/*.jar
