name: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Show files
        run: find . -maxdepth 3 -not -path './.git/*' | head -60
      - name: Get Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
      - name: Build
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path './gradle-2.14.1/*' | head -1)")
          echo "Building in $DIR"
          cd "$DIR"
          "$GITHUB_WORKSPACE/gradle-2.14.1/bin/gradle" setupCiWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TielCraftsDumbHello-jar
          path: '**/build/libs/*.jar'
